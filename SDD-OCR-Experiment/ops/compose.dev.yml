version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-ocr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_ocr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-ocr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: quay.io/minio/minio:latest
    container_name: ai-ocr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    # For production: enable server-side encryption (SSE-S3/SSE-KMS) and store keys in a KMS.

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: ai-ocr-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: documents
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        echo 'Waiting for MinIO...'
        sleep 1
      done;
      mc mb --ignore-existing myminio/$${MINIO_BUCKET};
      echo 'Bucket created';
      exit 0;
      "

  preprocessing-python:
    build:
      context: ../services/preprocessing-python
      dockerfile: Dockerfile
    container_name: ai-ocr-preprocessing-python
    restart: unless-stopped
    environment:
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      PREPROCESSOR_REDIS_URL: redis://redis:6379
      PREPROCESSOR_LOG_LEVEL: INFO
    ports:
      - "8001:8001"
    depends_on:
      - redis
      - minio
    # For development: mount source code for live reload
    volumes:
      - ../services/preprocessing-python:/app
    working_dir: /app
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]


  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: ai-ocr-keycloak
    restart: unless-stopped
    command: start-dev --http-relative-path=/auth
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    # For real deployments wire KC to Postgres; dev uses embedded H2

volumes:
  pgdata:
  minio_data:
