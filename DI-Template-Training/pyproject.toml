[project]
name = "di-template-training"
version = "0.1.0"
description = "Azure Document Intelligence template model training via API"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-ai-documentintelligence>=1.0.0",
    "azure-storage-blob>=12.24.0",
    "azure-identity>=1.25.0",
    "python-dotenv>=1.2.0",
    "opencv-python>=4.12.0",
    "numpy>=2.0.0",
    "matplotlib>=3.10.0",
    "pandas>=2.3.0",
    "shapely>=2.0.0",
    "ipykernel (>=7.1.0,<8.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "jupyter-client (>=8.8.0,<9.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0,<8.0.0"
]
