events {
    worker_connections 1024;
}

http {
    upstream read_service {
        server read:5000;
    }

    upstream layout_service {
        server layout:5000;
    }

    upstream general_service {
        server general:5000;
    }

    server {
        listen 5000;
        server_name localhost;

        # Proxy for Read service
        location /read/ {
            proxy_pass http://read_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy for Layout service
        location /layout/ {
            proxy_pass http://layout_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy for General Document service
        location /general/ {
            proxy_pass http://general_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default route - can be configured as needed
        location / {
            return 200 "Document Intelligence Proxy - Use /read/, /layout/, or /general/ endpoints";
            add_header Content-Type text/plain;
        }
    }
}



