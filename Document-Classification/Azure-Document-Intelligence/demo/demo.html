<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Classifier Demo</title>
  <style>
    body { font-family: sans-serif; margin: 2em; }
    .result { margin-top: 2em; padding: 1em; border: 1px solid #ccc; background: #f9f9f9; }
    .loading { color: #888; }
  </style>
</head>
<body>
  <h1>Document Classifier Demo</h1>
  <form id="uploadForm" style="display: flex; gap: 2em; align-items: flex-start;">
    <div>
      <label for="fileInput">Select a file to classify:</label><br>
      <input type="file" id="fileInput" name="file" accept="image/*,.pdf" required />
      <button type="submit">Classify</button>
    </div>
  </form>
  <div id="flex-container" style="display:flex;width:100vw;height:100%;"> 
    <div id="previewContainer" style="width:50vw;">
      <div id="preview" style="margin-top:0.5em;"></div>
    </div>
    <div id="result" class="result" style="display:none;width:50vw;"></div>
  </div>
  
  <script src="demo.js"></script>
</body>
</html>
